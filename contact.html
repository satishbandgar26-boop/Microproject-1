<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Student Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f9;
    }
    .container {
      width: 400px;
      margin: 40px auto;
      background:linear-gradient(to bottom left,#ccc,lightblue);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    h1:hover{
        text-shadow: 2px 2px 5px rgb(128, 128, 242);
        transform: scale(1.2);
        transition: 0.4s;
        cursor: pointer;
    }
     
    form {
      margin-top: 20px;
    }
    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-bottom: 2px black;
      border-radius: 5px;
      border: 1px solid #d4c7c7;
    }
    button {
      width: 90%;
      padding: 12px;
      background-color: #4503fa;
      color: white;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:active {
      background-color: green;
    }
     
  </style>
</head>
<body>

<div class="container">
  <h1>Contact Us</h1> 

  <form onsubmit="showsms()">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <input type="password" placeholder="Enter Password" required>
     <input type="text" placeholder="Class" required>
    <button type="reset">Reset</button>
    <button type="submit">Submit</button>
     
  </form>
</div>
   <script>
    function showsms(){
    alert('Successfully Submited')
    }
</script>
</body>

</html>
